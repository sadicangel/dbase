name: release

on:
  push:
    tags: [ "v*" ]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    env:
      TAG_NAME: ${{ github.ref_name }}
    steps:
    - name: Validate version
      shell: bash
      run: |
        # Build metadata is excluded because NuGet does not use it in package identity.
        CORE='(0|[1-9][0-9]*)'
        PRERELEASE='(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)'
        if [[ ! "$TAG_NAME" =~ ^v${CORE}\.${CORE}\.${CORE}(-${PRERELEASE}(\.${PRERELEASE})*)?$ ]]; then
          echo "Expected a version tag such as v0.1.0 or v0.1.0-preview.6: $TAG_NAME"
          exit 1
        fi
        echo "VERSION=${TAG_NAME#v}" >> "$GITHUB_ENV"
    - name: Validate NuGet configuration
      shell: bash
      env:
        NUGET_USER: ${{ vars.NUGET_USER }}
      run: |
        if [[ -z "$NUGET_USER" ]]; then
          echo "Configure the NUGET_USER repository variable with your NuGet.org profile username."
          exit 1
        fi
    - uses: actions/checkout@v5
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 11.0.x
        dotnet-quality: preview
    - name: Restore dependencies
      run: dotnet restore dbase.sln
    - name: Build
      run: dotnet build dbase.sln --no-restore --configuration Release -p:Version="${VERSION}" -p:ContinuousIntegrationBuild=true
    - name: Test
      run: dotnet test dbase.sln --no-build --configuration Release --verbosity normal
    - name: Pack
      run: dotnet pack src/DBase/DBase.csproj --no-build --configuration Release -p:Version="${VERSION}" -p:ContinuousIntegrationBuild=true --output ./nupkg
    - name: NuGet login (trusted publishing)
      uses: NuGet/login@v1
      id: nuget_login
      with:
        user: ${{ vars.NUGET_USER }}
    - name: Publish to GitHub Packages
      run: dotnet nuget push ./nupkg/*.nupkg --source "https://nuget.pkg.github.com/${GITHUB_REPOSITORY_OWNER}/index.json" --api-key "${GITHUB_TOKEN}" --skip-duplicate
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Publish to nuget.org
      run: dotnet nuget push ./nupkg/*.nupkg --source "https://api.nuget.org/v3/index.json" --api-key "${NUGET_API_KEY}" --skip-duplicate
      env:
        NUGET_API_KEY: ${{ steps.nuget_login.outputs.NUGET_API_KEY }}
    - name: Create GitHub release
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        if gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
          gh release upload "$TAG_NAME" ./nupkg/*.nupkg --repo "$GITHUB_REPOSITORY" --clobber
        else
          RELEASE_FLAGS=()
          if [[ "$VERSION" == *-* ]]; then
            RELEASE_FLAGS+=(--prerelease --latest=false)
          fi
          gh release create "$TAG_NAME" ./nupkg/*.nupkg --repo "$GITHUB_REPOSITORY" \
            --verify-tag --generate-notes --title "$TAG_NAME" "${RELEASE_FLAGS[@]}"
        fi
